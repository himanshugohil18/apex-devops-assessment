groups:
  - name: apex-api-alerts
    rules:
      - alert: ApexAPIDown
        expr: up{job="apex-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Apex API is unavailable"
          description: "Prometheus cannot scrape the Apex API."

      - alert: ApexHigh5xxErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="apex-api",status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="apex-api"}[5m])), 0.001)
          ) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Apex API 5xx error rate is above 2%"

      - alert: ApexHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="apex-api"}[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Apex API p95 latency exceeds 500ms"
